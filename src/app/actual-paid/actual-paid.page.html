
<ion-header [translucent]="true">
  <ion-toolbar color="primary" style="border-radius: 0 0 18px 18px; box-shadow: 0 2px 12px #2563eb22; display: flex; align-items: center;">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()" fill="clear" color="light" style="margin-right: 4px;">
        <ion-icon name="arrow-back-outline" slot="icon-only" style="font-size: 1.4em;"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title style="font-weight: 700; letter-spacing: 0.5px;">บันทึกจ่ายจริง (Actual Paid)</ion-title>
  </ion-toolbar>
</ion-header>


<!-- Add goBack() handler in the component TypeScript file (actual-paid.page.ts): -->
<!--
import { Location } from '@angular/common';
constructor(private location: Location) {}
goBack() {
  this.location.back();
}
-->

<ion-content [fullscreen]="true" class="actual-paid-content">
  <ion-grid class="ap-grid">
    <ion-row class="ap-header-row">
      <ion-col size="12" size-md="6" class="ap-year-select-col">
        <div class="ap-year-select-wrapper">
          <ion-icon name="calendar-outline" style="font-size: 1.2em; color: #2563eb; margin-right: 8px;"></ion-icon>
          <label class="ap-year-label">ปีงบประมาณ:</label>
          <ion-select [(ngModel)]="selectedYear" (ionChange)="onYearChange($event)" interface="popover" class="ap-year-select">
            <ion-select-option *ngFor="let y of availableYears" [value]="y">{{ y }}</ion-select-option>
          </ion-select>
        </div>
      </ion-col>
    </ion-row>
    <div class="ap-table-wrapper">
      <table class="ap-table">
        <thead>
          <tr>
            <th>หมวด</th>
            <th>หนี้ค้างชำระtttt</th>
            <th>รายจ่ายจริง</th>
            <th>ประมาณการรายจ่าย<br/>ปีงบประมาณ {{ selectedYear || '-' }} <span class="ap-th-note">(จากแผนบันทึก)</span></th>
            <th>หมายเหตุ</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of planRows; let i = index" [class.ap-row-alt]="i % 2 !== 0">
            <td class="ap-td ap-td-item">{{ row.item }}</td>
            <td class="ap-td">0.00</td>
            <td class="ap-td">0.00</td>
            <td class="ap-td">{{ row.total ? (row.total | number:'1.2-2') : '0.00' }}</td>
            <td class="ap-td">-</td>
          </tr>
          <tr *ngIf="!planRows || planRows.length === 0" class="ap-empty-row">
            <td class="ap-td ap-td-empty" colspan="5">
              <ion-icon name="alert-circle-outline" style="color: #64748b; font-size: 1.3em; margin-right: 8px;"></ion-icon>
              ไม่พบข้อมูลแผนบันทึกสำหรับปีงบประมาณที่เลือก
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </ion-grid>
</ion-content>

<style>
.actual-paid-content {
  --background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
}
.ap-grid {
  background: #fff;
  border-radius: 18px;
  box-shadow: 0 4px 24px #2563eb18;
  margin: 24px auto 32px auto;
  max-width: 900px;
  padding: 0 0 18px 0;
  overflow-x: auto;
}
.ap-header-row {
  margin-top: 18px;
  margin-bottom: 8px;
}
.ap-year-select-col {
  display: flex;
  align-items: center;
  justify-content: flex-start;
}
.ap-year-select-wrapper {
  display: flex;
  align-items: center;
  background: #f1f5f9;
  border-radius: 8px;
  padding: 8px 16px;
  box-shadow: 0 1px 4px #2563eb11;
}
.ap-year-label {
  font-weight: 600;
  color: #2563eb;
  margin-right: 8px;
}
.ap-year-select {
  min-width: 90px;
  font-weight: 500;
  --background: #fff;
  --color: #222;
  --placeholder-color: #64748b;
}
/* Table styles for alignment */
.ap-table-wrapper {
  width: 100%;
  overflow-x: auto;
}
.ap-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px #2563eb11;
  font-size: 1.04em;
  margin-bottom: 0;
}
.ap-table th {
  background: #e2e8f0;
  color: #222;
  font-weight: bold;
  text-align: center;
  padding: 14px 8px;
  border-right: 1px solid #cbd5e1;
  border-bottom: 2px solid #cbd5e1;
  letter-spacing: 0.02em;
}
.ap-table th:last-child {
  border-right: none;
}
.ap-th-note {
  font-size: 0.92em;
  color: #64748b;
  font-weight: 400;
}
.ap-table td {
  padding: 12px 8px;
  color: #222;
  text-align: center;
  border-right: 1px solid #e2e8f0;
  border-bottom: 1px solid #e2e8f0;
  background: transparent;
}
.ap-table td:last-child {
  border-right: none;
}
.ap-td-item {
  font-weight: 500;
  text-align: left;
  padding-left: 18px;
}
.ap-row-alt td {
  background: #f1f5f9;
}
.ap-empty-row {
  background: #f8fafc;
}
.ap-td-empty {
  text-align: center;
  color: #64748b;
  font-size: 1.08em;
  padding: 24px 0;
}
@media (max-width: 700px) {
  .ap-grid {
    max-width: 100vw;
    border-radius: 0;
    box-shadow: none;
    margin: 0;
  }
  .ap-header-row {
    margin-top: 8px;
  }
  .ap-table th, .ap-table td {
    font-size: 0.98em;
    padding: 10px 4px;
  }
  .ap-td-item {
    padding-left: 8px;
  }
}
</style>
