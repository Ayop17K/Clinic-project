
<ion-header [translucent]="true">
  <ion-toolbar color="primary" style="box-shadow: 0 2px 12px #2563eb22;">
    <ion-title style="font-size: 1.25em; letter-spacing: 0.5px; color: #2563eb; font-weight: 600;">
      <ion-icon name="people-circle-outline" style="vertical-align: middle; margin-right: 10px; color: #ffe066;"></ion-icon>
      <span style="color: #fff;">เมนูจัดการระบบ (Manager Menu)</span>
    </ion-title>

    <ion-buttons slot="end">
      <ion-button color="danger" (click)="onLogout()" class="logout-btn">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        <span>ออกจากระบบ</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>


<style>
.logout-btn {
  font-weight: 600;
  font-size: 1.04em;
  border-radius: 8px;
  margin-left: 8px;
  background: #fff0f0;
  color: #dc2626;
  box-shadow: 0 2px 8px #dc262622;
  transition: background 0.2s, color 0.2s;
}
.logout-btn:hover {
  background: #fee2e2;
  color: #b91c1c;
}
</style>


<ion-content id="main-content" [fullscreen]="true" class="ion-padding decorated-bg">
  <div class="ion-text-center page-header">
    <img src="assets/icon/favicon.png" alt="logo" class="page-logo" />
    <div class="page-title">โรงพยาบาลส่งเสริมสุขภาพตำบลหนองปลิง</div>
    <div class="page-subtitle">อำเภอเมือง จังหวัดกำแพงเพชร</div>
    <div class="page-subtitle">สังกัด องค์การบริหารส่วนจังหวัดกำแพงเพชร</div>
  </div>
  <div class="menu-card-wrapper">
    <ion-card class="menu-card">
      <ion-card-header class="menu-card-header">
        <ion-card-title class="menu-card-title">
          <ion-icon name="list-circle-outline" color="primary"></ion-icon>
          เมนูการจัดการระบบ
        </ion-card-title>
      </ion-card-header>
      <ion-card-content class="menu-card-content">
        <ion-list lines="none">
          <ion-item button [routerLink]="['/all-plan']" class="menu-item">
            <ion-icon name="cash-outline" slot="start" color="success"></ion-icon>
            <span>เพิ่มข้อมูลแผนการใช้จ่าย</span>
          </ion-item>
          <ion-item button [routerLink]="['/plan-record']" class="menu-item">
            <ion-icon name="list-outline" slot="start" color="tertiary"></ion-icon>
            <span>เรียกดูข้อมูลแผนการใช้จ่าย</span>
          </ion-item>
          <!--
          <ion-item button [routerLink]="['/actual-paid']" class="menu-item">
            <ion-icon name="card-outline" slot="start" color="warning"></ion-icon>
            <span>บันทึกจ่ายจริง (Actual Paid)</span>
          </ion-item>
        -->
        </ion-list>
      </ion-card-content>
    </ion-card>
  </div>

  <div class="decorative-shape shape-1"></div>
  <div class="decorative-shape shape-2"></div>
  <div class="decorative-shape shape-3"></div>
</ion-content>

<style>
.decorated-bg {
  background: #fff;
  min-height: 100vh;
  position: relative;
}
.page-header {
  margin-bottom: 24px;
  margin-top: 18px;
}
.page-logo {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  margin-bottom: 8px;
  box-shadow: 0 2px 12px #2563eb22;
}
.page-title {
  font-size: 1.35em;
  color: #2563eb;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.page-subtitle {
  color: #64748b;
  font-size: 1em;
  margin-top: 2px;
}
.menu-card-wrapper {
  max-width: 600px;
  margin: 0 auto;
}
.menu-card {
  border-radius: 22px;
  box-shadow: 0 6px 32px #2563eb18;
  background: #fff;
}
.menu-card-header {
  background: linear-gradient(90deg, #e0e7ef 0%, #f1f5f9 100%);
  border-radius: 22px 22px 0 0;
  padding: 28px 20px 16px 20px;
}
.menu-card-title {
  font-size: 1.32em;
  color: #2563eb;
  font-weight: 700;
  letter-spacing: 0.2px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.menu-card-content {
  padding: 28px 16px 28px 16px;
}
.menu-item {
  border-radius: 16px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px #2563eb11;
  font-weight: 500;
  color: #1e293b;
  font-size: 1.18em;
  padding: 18px 12px;
  transition: background 0.2s, box-shadow 0.2s;
}
.menu-item:last-child {
  margin-bottom: 0;
}
.menu-item:hover {
  background: #e0e7ff;
  box-shadow: 0 6px 20px #2563eb22;
}
.menu-item ion-icon {
  font-size: 1.5em;
}
.decorative-shape {
  position: absolute;
  z-index: 0;
  opacity: 0.13;
  pointer-events: none;
}
.shape-1 {
  top: 0;
  left: 0;
  width: 180px;
  height: 180px;
  background: radial-gradient(circle at 40% 40%, #2563eb 0%, #e0e7ff 100%);
  border-radius: 50%;
}
.shape-2 {
  bottom: 0;
  right: 0;
  width: 140px;
  height: 140px;
  background: radial-gradient(circle at 60% 60%, #fbbf24 0%, #f8fafc 100%);
  border-radius: 50%;
}
.shape-3 {
  top: 60%;
  left: -60px;
  width: 120px;
  height: 120px;
  background: radial-gradient(circle at 60% 60%, #22d3ee 0%, #f8fafc 100%);
  border-radius: 50%;
}
@media (max-width: 700px) {
  .menu-card-wrapper {
    max-width: 100vw;
  }
  .menu-card {
    border-radius: 10px;
    box-shadow: 0 2px 8px #2563eb11;
  }
  .menu-card-header {
    border-radius: 10px 10px 0 0;
    padding: 12px 8px 8px 8px;
  }
  .menu-card-content {
    padding: 12px 4px 12px 4px;
  }
  .page-logo {
    width: 48px;
    height: 48px;
  }
  .page-title {
    font-size: 1.08em;
  }
  
}</style>
