<ion-menu side="start" menuId="main-menu" contentId="main-content">
  <ion-header>
    <ion-toolbar color="primary">
      <ion-title>เมนู</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-item routerLink="/financial-plans">
        <ion-icon name="cash-outline" slot="start" color="success"></ion-icon>
        เพิ่มข้อมูลงบจัดสรร
      </ion-item>
      <ion-item routerLink="/menu-6">
        <ion-icon name="add-circle-outline" slot="start" color="primary"></ion-icon>
        เพิ่มข้อมูลแผนการเงิน
      </ion-item>
      <ion-item routerLink="/records">
        <ion-icon name="list-outline" slot="start" color="tertiary"></ion-icon>
        เรียกดูข้อมูล
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<ion-header [translucent]="true">
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-menu-button menu="main-menu"></ion-menu-button>
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <ion-icon name="cash-outline" style="vertical-align: middle; margin-right: 8px;" color="success"></ion-icon>
      Financial Plans
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content id="main-content" [fullscreen]="true" class="ion-padding">
  <!-- Removed the year filter section here -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>
        <ion-icon name="cash-outline" color="success"></ion-icon>
        เพิ่มแผนการเงินใหม่
      </ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="floating">แผนการเงิน</ion-label>
        <ion-input 
          type="text" 
          [(ngModel)]="planName"
          placeholder="กรอกงบแผนการเงิน">
        </ion-input>
      </ion-item>
      
      <div style="display: flex; flex-direction: column; align-items: center; margin: 24px 0 8px 0;">
        <ion-label style="margin-bottom: 8px; font-weight: bold; text-align: center; width: 100%;">ปีงบประมาณ</ion-label>
        <ion-datetime
          presentation="year"
          [(ngModel)]="planDate"
          placeholder="เลือกปี"
          style="width: 180px; margin: 0 auto;"
        ></ion-datetime>
        <ion-text color="medium" *ngIf="planDate">
          <small>ปี พ.ศ. {{ getBuddhistYear(planDate) }}</small>
        </ion-text>
      </div>

      <ion-button expand="block" color="primary" (click)="savePlan()" style="margin-top: 16px;">
        <ion-icon name="save-outline" slot="start"></ion-icon>
        บันทึก
      </ion-button>
      <ion-button expand="block" color="tertiary" [routerLink]="['/records']">
        <ion-icon name="list-outline" slot="start"></ion-icon>
        Go to Records
      </ion-button>
      <ion-text color="success" *ngIf="planSaved">
        <p>บันทึกแผนการเงินเรียบร้อยแล้ว!</p>
      </ion-text>
    </ion-card-content>
  </ion-card>

  <!-- Add this section for displaying saved entries -->
  
</ion-content>
